services:
  - type: web
    name: convergence-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
