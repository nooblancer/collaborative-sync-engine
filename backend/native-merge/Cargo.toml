[package]
name = "native-merge"
version = "0.1.0"
edition = "2021"
description = "Native CRDT merge addon for the Collaborative Sync Engine via napi-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
